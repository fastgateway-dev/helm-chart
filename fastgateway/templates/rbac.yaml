{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "fastgateway.fullname" . }}
  labels:
    {{- include "fastgateway.labels" . | nindent 4 }}
rules:
  # Namespace access
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create"]
  # Service discovery
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]
  # Secrets: managed-cert TLS secrets distributed to tenant/gateway
  # namespaces, BYO TLS secrets, and per-client API-key secrets. The backend
  # creates/updates/deletes these (e.g. cluster.CreateOrUpdateTLSSecret,
  # CreateAPIKeySecret), so get/list alone is not enough.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ConfigMaps (for Direct Response body storage)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pods (for validating Envoy Gateway installation)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Deployments (for validating Envoy Gateway installation)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # CustomResourceDefinitions (cluster-scoped; for detecting the installed Gateway
  # API version from the gateway.networking.k8s.io/bundle-version annotation)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  # Gateway API - GatewayClass
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API - Gateway
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API - HTTPRoute
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API - GRPCRoute
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["grpcroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API - TCPRoute
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["tcproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API - TLSRoute
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["tlsroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Gateway API - ReferenceGrant
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["referencegrants"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Status subresources
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways/status", "httproutes/status", "grpcroutes/status"]
    verbs: ["get", "list", "watch"]
  # Envoy Gateway - EnvoyProxy
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyproxies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Envoy Gateway - SecurityPolicy
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["securitypolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Envoy Gateway - Backend
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["backends"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Envoy Gateway - BackendTrafficPolicy
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["backendtrafficpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Envoy Gateway - HTTPRouteFilter
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["httproutefilters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Envoy Gateway - ClientTrafficPolicy
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["clienttrafficpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Envoy Gateway - EnvoyExtensionPolicy (for Lua and Wasm extensions)
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["envoyextensionpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # cert-manager - Issuers, Certificates, CertificateRequests (certificate management)
  # Namespaced Issuers are used (in fastgateway-system); no cluster-scoped ClusterIssuers.
  - apiGroups: ["cert-manager.io"]
    resources: ["issuers", "certificates", "certificaterequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "fastgateway.fullname" . }}
  labels:
    {{- include "fastgateway.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "fastgateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "fastgateway.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
